[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tscd-net"
version = "0.2.0"
description = "Chronological TSCD-Net model for user-level depression detection on SWDD"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "sentence-transformers>=2.7,<6",
  "torch>=2.1,<3",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
cjk = [
  "opencc-python-reimplemented>=0.1.7,<1",
]
analysis = [
  "matplotlib>=3.7,<4",
  "scipy>=1.10,<2",
]
test = [
  "pytest>=8,<9",
]

[project.scripts]
tscdnet = "tscd_net.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

